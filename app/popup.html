<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- style-src에 'unsafe-inline'이 없으므로 style 속성은 무시된다.
       동적인 값(막대 너비 등)은 마크업이 아니라 el.style로 줘야 한다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>AI Usage 상세</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="sheet">
    <div class="head">
      <h1>사용량</h1>
      <span class="spacer"></span>
      <button class="btn" id="refresh">새로고침</button>
      <button class="btn icon" id="close" aria-label="닫기">✕</button>
    </div>

    <div class="progress" id="progress" hidden><span></span></div>
    <div class="body" id="body"></div>

    <div class="foot">
      <span class="when" id="when"></span>
      <span class="spacer"></span>
      <button class="btn danger" id="quit">종료</button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
